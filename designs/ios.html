const getCat = id => CATS.find(c=>c.id===id)||CATS[0];

const TODAY = (() => { const d=new Date(); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; })();
function fmtDate(d){ return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function parseDate(s){ const[y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  {id:18,title:'Quarterly review', date:'2026-05-29',time:'10:00',end:'12:00',cat:'work',   recur:''},

function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function firstDow(y,m){ return new Date(y,m,1).getDay(); }
function fmtTime(t){ if(!t)return''; const[h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; return `${h%12||12}:${p2(m)} ${ap}`; }

function MenuIcon(){return(<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3" y="3" width="16" height="16" rx="3" stroke="currentColor" strokeWidth="1.6"/><path d="M7 8h8M7 12h6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>);}
function BellIcon(){return(<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3a4 4 0 014 4v3l1.4 2.4a.5.5 0 01-.43.76H4.93a.5.5 0 01-.43-.76L6 10V7a4 4 0 014-4z" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><path d="M8.5 15a1.5 1.5 0 003 0" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>);}

// ─── MINI CALENDAR ────────────────────────────────────────────────────────────
// Fantastical-style: numbers with up to 4 colored event dots beneath each date.
function IOSMiniCal({ year, month, selDate, onSelect, events }) {
  const first = firstDow(year, month);
  const days  = daysInMonth(year, month);
  const prevDays = daysInMonth(month===0?year-1:year, month===0?11:month-1);

  const evByDate = {};
  events.forEach(e => {
    if(!evByDate[e.date]) evByDate[e.date] = [];
    if(evByDate[e.date].length < 4) evByDate[e.date].push(getCat(e.cat).color);
  });

  const cells = [];
  for(let i=first-1; i>=0; i--) cells.push({ d: prevDays-i, off:true, ds:null });
  for(let i=1; i<=days; i++) cells.push({ d:i, off:false, ds:`${year}-${p2(month+1)}-${p2(i)}` });
  let next=1; while(cells.length < 42) { cells.push({ d:next++, off:true, ds:null }); }

  // Highlight the row that contains the selected day
  const selRow = (() => {
    const idx = cells.findIndex(c => c.ds === selDate);
    return idx >= 0 ? Math.floor(idx/7) : -1;
  })();

  const rows = [];
  for(let r=0; r<6; r++) rows.push(cells.slice(r*7, r*7+7));

  return (
    <div style={{ padding:'2px 12px 8px' }}>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', textAlign:'center', marginBottom:4 }}>
        {DAYS3.map((d,i)=>(
          <div key={d} style={{ fontSize:10, fontWeight:700, color: i===0?T.accent:T.textMute, padding:'4px 0', letterSpacing:'.06em' }}>{d.toUpperCase()}</div>
        ))}
      </div>
      {rows.map((row, ri) => (
        <div key={ri} style={{
          display:'grid', gridTemplateColumns:'repeat(7,1fr)',
          background: ri===selRow ? T.borderSoft : 'transparent',
          borderRadius: 8, transition:'background 0.15s',
        }}>
          {row.map((cell, ci) => {
            const isSel = !cell.off && cell.ds===selDate;
            const isToday = !cell.off && cell.ds===TODAY;
            const dots = cell.ds ? (evByDate[cell.ds]||[]) : [];
            return (
              <div key={ci} onClick={()=>!cell.off && onSelect(cell.ds)}
                style={{ padding:'5px 0 4px', textAlign:'center', cursor:cell.off?'default':'pointer', minHeight:46 }}>
                <div style={{
                  width:30, height:30, lineHeight:'30px', borderRadius:'50%', margin:'0 auto',
                  fontSize:14, fontWeight: isSel||isToday ? 700 : 400,
                  background: isSel ? T.selBg : 'transparent',
                  color: isSel ? '#fff' : cell.off ? T.textFaint : isToday ? T.accent : T.text,
                  transition:'background 0.15s',
                }}>{cell.d}</div>
                <div style={{ display:'flex', justifyContent:'center', gap:2, marginTop:3, height:6 }}>
                  {dots.map((c,j) => <div key={j} style={{ width:5, height:5, borderRadius:'50%', background:c }}/>)}
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// ─── EVENT ROW ───────────────────────────────────────────────────────────────
const PRI_COLOR = { low:'#2DA87E', medium:'#E85D3A', high:'#D946EF' };
function IOSEventRow({ ev, onPress }) {
  const c = getCat(ev.cat);
  const [hov, setHov] = React.useState(false);
  return (
    <div onClick={onPress}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{
        display:'flex', alignItems:'flex-start', gap:12,
        padding:'8px 6px', cursor:'pointer',
        background: hov ? T.cardHover : 'transparent',
        borderRadius:8, marginBottom:2,
        transition:'background 0.15s',
      }}>
      <div style={{ width:10, height:10, borderRadius:'50%', background:c.color, marginTop:6, flexShrink:0 }}/>
      <div style={{ flex:1, minWidth:0 }}>
        {!ev.isTask && ev.time && (
          <div style={{ fontSize:12, fontWeight:600, color:T.textSub, marginBottom:1 }}>
            {fmtTime(ev.time)}{ev.end ? ` – ${fmtTime(ev.end)}` : ''}
          </div>
        )}
        <div style={{ fontSize:15, color:T.text, fontWeight:500, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{ev.title}</div>
        {ev.isTask && ev.priority && (
          <div style={{ fontSize:11, color:PRI_COLOR[ev.priority], fontWeight:600, marginTop:2 }}>
            {ev.priority.charAt(0).toUpperCase()+ev.priority.slice(1)} priority
          </div>
        )}
        {ev.recur && !ev.isTask && (
          <div style={{ fontSize:11, color:c.color, marginTop:1 }}>↻ {ev.recur}</div>
        )}
      </div>
      {ev.isTask && (
        <div style={{ width:20, height:20, borderRadius:'50%', border:`1.5px solid ${c.color}`, marginTop:4, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
          <svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3.5l2.5 2.5 4.5-5" stroke={c.color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </div>
      )}
    </div>
  );
}

// ─── AGENDA VIEW ─────────────────────────────────────────────────────────────
function IOSAgenda({ events, onPress }) {
  const upcoming=[...events].filter(e=>e.date>=TODAY).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const grouped={};
  upcoming.forEach(e=>{ if(!grouped[e.date]) grouped[e.date]=[]; grouped[e.date].push(e); });

  return (
    <div style={{ padding:'14px 18px 100px' }}>
      {upcoming.length===0 && (
        <div style={{ padding:'40px 0', textAlign:'center', color:T.textFaint, fontSize:13 }}>No upcoming events</div>
      )}
      {Object.entries(grouped).map(([date,evs]) => {
        const isToday=date===TODAY;
        return (
          <div key={date} style={{ marginBottom:18 }}>
            <div style={{ display:'flex', alignItems:'baseline', gap:10, marginBottom:8 }}>
              <span style={{ fontSize:14, fontWeight:700, color: isToday?T.accent:T.text, letterSpacing:'.04em' }}>
                {isToday ? 'TODAY' : parseDate(date).toLocaleDateString('en-US',{weekday:'long'}).toUpperCase()}
              </span>
              <span style={{ fontSize:13, color:T.textMute }}>{date}</span>
              <div style={{ flex:1, height:1, background:T.border, marginLeft:6 }}/>
            </div>
            {evs.map(ev=><IOSEventRow key={ev.id} ev={ev} onPress={()=>onPress(ev)}/>)}
          </div>
        );
      })}
    </div>
  );
}

// ─── SEARCH VIEW ─────────────────────────────────────────────────────────────
function IOSSearchResults({ events, search, onPress }) {
  if(!search) return (
    <div style={{ padding:'60px 20px', textAlign:'center', color:T.textFaint }}>
      <div style={{ fontSize:13 }}>Search for events and tasks</div>
    </div>
  );
  const results=events.filter(e=>e.title.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.date.localeCompare(b.date));
  return (
    <div style={{ padding:'14px 18px 100px' }}>
      <div style={{ fontSize:11, color:T.textMute, marginBottom:10, letterSpacing:'.04em', fontWeight:600 }}>{results.length} RESULT{results.length!==1?'S':''}</div>
      {results.map(ev=><IOSEventRow key={ev.id} ev={ev} onPress={()=>onPress(ev)}/>)}
      {results.length===0 && (
        <div style={{ padding:'30px 0', textAlign:'center', color:T.textFaint, fontSize:13 }}>No events found</div>
      )}
    </div>
  );
}

// ─── EDITOR PANEL ─────────────────────────────────────────────────────────────
function IOSEditorPanel({ defaultDate, editEv, onClose, onSave, onDelete }) {
  const isEdit = !!(editEv?.id);
  const [tab,       setTab]      = React.useState(editEv?.isTask?'task':'event');
  const [title,     setTitle]    = React.useState(!editEv?.isTask?(editEv?.title||''):'');
  const [date,      setDate]     = React.useState(editEv?.date||defaultDate||TODAY);
  const [time,      setTime]     = React.useState(editEv?.time||'09:00');
  const [end,       setEnd]      = React.useState(editEv?.end||'10:00');
  const [cat,       setCat]      = React.useState(editEv?.cat||'work');
  const [recur,     setRecur]    = React.useState(editEv?.recur||'');
  const [taskTitle, setTaskTitle]= React.useState(editEv?.isTask?(editEv?.title?.replace(' ✓','')||''):'');
  const [dueDate,   setDueDate]  = React.useState(editEv?.date||defaultDate||TODAY);
  const [remind,    setRemind]   = React.useState(editEv?.remind||'1-day');
  const [priority,  setPriority] = React.useState(editEv?.priority||'medium');

  const handleSave = () => {
    if(tab==='event') { if(!title.trim()) return; onSave({...(editEv||{}),title,date,time,end,cat,recur,isTask:false}); }
    else { if(!taskTitle.trim()) return; onSave({...(editEv||{}),title:taskTitle.replace(' ✓','')+' ✓',date:dueDate,time:'',end:'',cat:'personal',recur:'',isTask:true,remind,priority}); }
  };

  const rowSt    = { padding:'13px 16px', display:'flex', alignItems:'center', justifyContent:'space-between', borderBottom:`1px solid ${T.borderSoft}` };
  const inputSt  = { fontSize:14, color:T.text, background:'transparent', border:'none', outline:'none', textAlign:'right', width:'60%' };
  const cardSt   = { margin:'0 16px 10px', borderRadius:14, overflow:'hidden', background:T.surface, border:`1px solid ${T.border}` };

  return (
    <div style={{ position:'absolute', inset:0, zIndex:200, display:'flex', flexDirection:'column', justifyContent:'flex-end' }}
      onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div style={{ position:'absolute', inset:0, background:'rgba(20,15,12,0.4)', animation:'fadeIn 0.2s ease' }}/>
      <div style={{
        position:'relative', zIndex:1,
        background: T.bg, borderRadius:'24px 24px 0 0',
        maxHeight:'88%', overflowY:'auto',
        borderTop:`1px solid ${T.border}`,
        animation:'slideUp 0.3s cubic-bezier(0.32,0.72,0,1)',
      }}>
        <div style={{ display:'flex', justifyContent:'center', padding:'12px 0 4px' }}>
          <div style={{ width:40, height:4, borderRadius:2, background:T.border }}/>
        </div>

        <div style={{ display:'flex', padding:'4px 16px 12px', gap:8 }}>
          {['event','task'].map(t=>(
            <button key={t} onClick={()=>setTab(t)} style={{
              flex:1, padding:'10px 0', borderRadius:10, border:`1px solid ${tab===t?T.accent:T.border}`, cursor:'pointer', fontSize:13, fontWeight:600,
              background: tab===t ? T.accent : T.surface, color: tab===t ? '#fff' : T.textSub,
              transition:'all 0.15s',
            }}>{t==='event'?'Event':'Task'}</button>
          ))}
        </div>

        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 16px 14px' }}>
          <button onClick={onClose} style={{ background:'none', border:'none', cursor:'pointer', fontSize:14, color:T.accent, fontWeight:500 }}>Cancel</button>
          <span style={{ fontWeight:700, fontSize:15, color:T.text }}>
            {isEdit?(tab==='event'?'Edit Event':'Edit Task'):(tab==='event'?'New Event':'New Task')}
          </span>
          <button onClick={handleSave} style={{ background:'none', border:'none', cursor:'pointer', fontSize:14, color:T.accent, fontWeight:700 }}>{isEdit?'Save':'Add'}</button>
        </div>

        {tab==='event' && (
          <>
            <div style={cardSt}>
              <div style={rowSt}>
                <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Event title"
                  style={{ fontSize:15, fontWeight:500, border:'none', outline:'none', background:'transparent', width:'100%', color:T.text }} autoFocus/>
              </div>
            </div>
            <div style={cardSt}>
              <div style={rowSt}><span style={{ fontSize:14, color:T.text, fontWeight:500 }}>Date</span><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={inputSt}/></div>
              <div style={rowSt}><span style={{ fontSize:14, color:T.text, fontWeight:500 }}>Start</span><input type="time" value={time} onChange={e=>setTime(e.target.value)} style={inputSt}/></div>
              <div style={{ ...rowSt, borderBottom:'none' }}><span style={{ fontSize:14, color:T.text, fontWeight:500 }}>End</span><input type="time" value={end} onChange={e=>setEnd(e.target.value)} style={inputSt}/></div>
            </div>
            <div style={cardSt}>
              <div style={rowSt}>
                <span style={{ fontSize:14, color:T.text, fontWeight:500 }}>Category</span>
                <div style={{ display:'flex', gap:8 }}>
                  {CATS.map(c=><div key={c.id} onClick={()=>setCat(c.id)} style={{ width:22, height:22, borderRadius:'50%', background:c.color, cursor:'pointer', boxShadow:cat===c.id?`0 0 0 2px ${T.surface}, 0 0 0 4px ${c.color}`:'none', transition:'box-shadow 0.15s' }}/>)}
                </div>
              </div>
              <div style={{ ...rowSt, borderBottom:'none' }}>
                <span style={{ fontSize:14, color:T.text, fontWeight:500 }}>Repeat</span>
                <select value={recur} onChange={e=>setRecur(e.target.value)} style={{ ...inputSt, cursor:'pointer' }}>
                  {['','Daily','Weekly','Monthly','Yearly'].map(r=><option key={r} value={r}>{r||'Never'}</option>)}
                </select>
              </div>
            </div>
          </>
        )}

        {tab==='task' && (
          <>
            <div style={cardSt}>
              <div style={{ ...rowSt, borderBottom:'none' }}>
                <input value={taskTitle} onChange={e=>setTaskTitle(e.target.value)} placeholder="Task name"
                  style={{ fontSize:15, fontWeight:500, border:'none', outline:'none', background:'transparent', width:'100%', color:T.text }} autoFocus/>
              </div>
            </div>
            <div style={cardSt}>
              <div style={{ ...rowSt, borderBottom:'none' }}>
                <span style={{ fontSize:14, color:T.text, fontWeight:500 }}>Due date</span>
                <input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} style={inputSt}/>
              </div>
            </div>
            <div style={{ ...cardSt, padding:'12px 16px' }}>
              <div style={{ fontSize:11, fontWeight:700, color:T.textMute, marginBottom:10, letterSpacing:'.06em' }}>REMIND ME</div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:7 }}>
                {[{v:'at-time',l:'At due time'},{v:'30-min',l:'30 min before'},{v:'1-day',l:'1 day before'},{v:'1-week',l:'1 week before'},{v:'2-weeks',l:'2 weeks before'},{v:'custom',l:'Custom…'}].map(r=>(
                  <div key={r.v} onClick={()=>setRemind(r.v)} style={{
                    padding:'9px 6px', borderRadius:8, cursor:'pointer', fontSize:11, fontWeight:600, textAlign:'center',
                    background: remind===r.v ? T.accent : T.surface,
                    color: remind===r.v ? '#fff' : T.textSub,
                    border:`1px solid ${remind===r.v ? T.accent : T.border}`,
                    transition:'all 0.15s',
                  }}>{r.l}</div>
                ))}
              </div>
            </div>
            <div style={{ ...cardSt, padding:'12px 16px' }}>
              <div style={{ fontSize:11, fontWeight:700, color:T.textMute, marginBottom:10, letterSpacing:'.06em' }}>PRIORITY</div>
              <div style={{ display:'flex', gap:8 }}>
                {[{v:'low',l:'Low',c:'#2DA87E'},{v:'medium',l:'Medium',c:'#E85D3A'},{v:'high',l:'High',c:'#D946EF'}].map(p=>(
                  <div key={p.v} onClick={()=>setPriority(p.v)} style={{
                    flex:1, padding:'10px 0', textAlign:'center', borderRadius:8, cursor:'pointer',
                    fontSize:12, fontWeight:700,
                    background: priority===p.v ? p.c : T.surface,
                    color: priority===p.v ? '#fff' : p.c,
                    border:`1px solid ${priority===p.v ? p.c : T.border}`,
                    transition:'all 0.15s',
                  }}>{p.l}</div>
                ))}
              </div>
            </div>
          </>
        )}

        {isEdit && onDelete && (
          <div style={cardSt}>
            <button onClick={()=>onDelete(editEv.id)} style={{
              width:'100%', padding:'15px', background:'transparent', border:'none', cursor:'pointer',
              fontSize:15, color:'#E54D5A', fontWeight:500,
            }}>Delete {tab==='event'?'Event':'Task'}</button>
          </div>
        )}
        <div style={{ height:32 }}/>
      </div>
    </div>
  );
}

// ─── iOS CALENDAR ─────────────────────────────────────────────────────────────
function IOSCalendar({ events, setEvents }) {
  const [tab,      setTab]     = React.useState('calendar');
  const [year,     setYear]    = React.useState(parseDate(TODAY).getFullYear());
  const [month,    setMonth]   = React.useState(parseDate(TODAY).getMonth());
  const [selDate,  setSelDate] = React.useState(TODAY);
  const [editorEv, setEditorEv]= React.useState(null);
  const [search,   setSearch]  = React.useState('');

  const navMonth = d => {
    let m=month+d, y=year;
    if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    setMonth(m); setYear(y);
  };

  const filtered = search ? events.filter(e=>e.title.toLowerCase().includes(search.toLowerCase())) : events;
  const dayEvs   = filtered.filter(e=>e.date===selDate);

  const saveEvent = ev => {
    if(ev.id) setEvents(evs=>evs.map(e=>e.id===ev.id?ev:e));
    else setEvents(evs=>[...evs,{...ev,id:Date.now()}]);
  };
  const deleteEvent = id => setEvents(evs=>evs.filter(e=>e.id!==id));

  return (
    <div style={{ position:'relative', display:'flex', flexDirection:'column', height:'100%', overflow:'hidden', background:T.bg, color:T.text }}>

      {/* Single top bar — title/search input on the left, bell + search icons on the right */}
      <div style={{
        flexShrink:0, padding:'14px 18px 10px',
        display:'flex', alignItems:'center', justifyContent:'space-between', gap:12,
        background:T.bg,
      }}>
        {tab==='calendar' && (
          <div style={{ display:'flex', alignItems:'baseline', gap:8, minWidth:0 }}>
            <div style={{ fontSize:26, fontWeight:700, color:T.text, letterSpacing:'-0.03em', lineHeight:1 }}>{MONTHS[month]}</div>
            <div style={{ fontSize:26, fontWeight:700, color:T.accent, letterSpacing:'-0.02em', lineHeight:1 }}>{year}</div>
          </div>
        )}
        {tab==='agenda' && (
          <div style={{ fontSize:24, fontWeight:700, color:T.text, letterSpacing:'-0.03em', lineHeight:1 }}>Upcoming</div>
        )}
        {tab==='search' && (
          <div style={{ position:'relative', flex:1 }}>
            <svg style={{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)' }} width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke={T.textMute} strokeWidth="1.4"/><path d="M10 10l2.5 2.5" stroke={T.textMute} strokeWidth="1.4" strokeLinecap="round"/></svg>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search events…"
              style={{ width:'100%', padding:'9px 12px 9px 32px', borderRadius:10, border:`1px solid ${T.border}`, background:T.surface, fontSize:14, color:T.text, outline:'none' }} autoFocus/>
          </div>
        )}
        <div style={{ display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
          <button title="Notifications" style={{ background:'none', border:'none', cursor:'pointer', color:T.accent, padding:4, display:'flex' }}>
            <BellIcon/>
          </button>
          <button title="Search" onClick={()=>setTab(tab==='search'?'calendar':'search')} style={{ background:'none', border:'none', cursor:'pointer', color:T.accent, padding:4, display:'flex' }}>
            <SearchIconSm/>
          </button>
        </div>
      </div>

      {tab==='calendar' && (
        <IOSMiniCal year={year} month={month} selDate={selDate}
          onSelect={d=>setSelDate(d)} events={filtered}/>
      )}

      {/* Content area */}
      <div style={{ flex:1, overflowY:'auto', minHeight:0, borderTop: tab==='calendar' ? `1px solid ${T.border}` : 'none' }}>
        {tab==='calendar' && (
          <div style={{ padding:'14px 18px 100px' }}>
            <div style={{ display:'flex', alignItems:'baseline', gap:10, marginBottom:10 }}>
              <span style={{ fontSize:14, fontWeight:700, color: selDate===TODAY ? T.accent : T.text, letterSpacing:'.04em' }}>
                {selDate===TODAY ? 'TODAY' : parseDate(selDate).toLocaleDateString('en-US',{weekday:'long'}).toUpperCase()}
              </span>
              <span style={{ fontSize:13, color:T.textMute }}>{selDate}</span>
            </div>
            {dayEvs.length===0 && (
              <div style={{ padding:'28px 0', textAlign:'center', color:T.textFaint, fontSize:13 }}>Nothing scheduled</div>
            )}
            {dayEvs.sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(ev=>
              <IOSEventRow key={ev.id} ev={ev} onPress={()=>setEditorEv(ev)}/>
            )}
          </div>
        )}
        {tab==='agenda' && <IOSAgenda events={filtered} onPress={ev=>setEditorEv(ev)}/>}
        {tab==='search' && <IOSSearchResults events={filtered} search={search} onPress={ev=>setEditorEv(ev)}/>}
      </div>

      {/* FAB */}
      {tab !== 'search' && (
        <button onClick={()=>setEditorEv({date:selDate})} style={{
          position:'absolute', right:18, bottom:90, width:54, height:54,
          borderRadius:'50%', background:T.surface, border:`1px solid ${T.border}`, cursor:'pointer',
          display:'flex', alignItems:'center', justifyContent:'center',
          boxShadow:'0 6px 20px rgba(0,0,0,0.12)', zIndex:10,
          transition:'transform 0.15s, box-shadow 0.15s',
        }}
        onMouseEnter={e=>{e.currentTarget.style.transform='scale(1.06)';e.currentTarget.style.boxShadow='0 8px 24px rgba(0,0,0,0.16)';}}
        onMouseLeave={e=>{e.currentTarget.style.transform='scale(1)';e.currentTarget.style.boxShadow='0 6px 20px rgba(0,0,0,0.12)';}}>
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 4v14M4 11h14" stroke={T.accent} strokeWidth="2.4" strokeLinecap="round"/></svg>
        </button>
      )}

      {/* Tab bar */}
      <div style={{
        position:'absolute', bottom:0, left:0, right:0, zIndex:10,
        display:'flex', background:'rgba(255,255,255,0.92)',
        borderTop:`1px solid ${T.border}`,
        backdropFilter:'blur(20px)', WebkitBackdropFilter:'blur(20px)',
        paddingBottom:22, paddingTop:6,
      }}>
        {[
          { id:'calendar', label:'Calendar', icon: <CalIcon/> },
          { id:'agenda',   label:'Agenda',   icon: <ListIcon/> },
          { id:'search',   label:'Search',   icon: <SearchIcon/> },
        ].map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:3,
            padding:'4px 0', background:'none', border:'none', cursor:'pointer',
          }}>
            <div style={{ color: tab===t.id ? T.accent : T.textMute, transition:'color 0.2s' }}>{t.icon}</div>
            <span style={{ fontSize:10, fontWeight: tab===t.id ? 700 : 500, color: tab===t.id ? T.accent : T.textMute }}>{t.label}</span>
          </button>
        ))}
      </div>

      {/* Editor sheet */}
      {editorEv !== null && (
        <IOSEditorPanel
          defaultDate={editorEv.date||selDate}
          editEv={editorEv.id?editorEv:null}
          onClose={()=>setEditorEv(null)}
          onSave={ev=>{saveEvent(ev);setEditorEv(null);}}
          onDelete={id=>{deleteEvent(id);setEditorEv(null);}}
        />
      )}
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [events, setEvents] = React.useState(EVENTS_INIT);
  return (
    <div style={{ width:'100%', height:'100%', background:T.bg }}>
      <IOSCalendar events={events} setEvents={setEvents}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
