<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Remindly — iOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { width: 100%; height: 100%; font-family: 'DM Sans', sans-serif; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }

  @keyframes float1 { 0%,100%{transform:translateY(0) scale(1);} 55%{transform:translateY(-24px) scale(1.04);} }
  @keyframes float2 { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(18px) scale(0.96);} }
  @keyframes float3 { 0%,100%{transform:translateY(0);} 45%{transform:translateY(-14px);} }
  @keyframes float4 { 0%,100%{transform:translateY(0) scale(1);} 60%{transform:translateY(20px) scale(1.05);} }
  @keyframes slideUp { from{opacity:0;transform:translateY(100%);} to{opacity:1;transform:translateY(0);} }
  @keyframes fadeIn  { from{opacity:0;} to{opacity:1;} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ─── THEMES ──────────────────────────────────────────────────────────────────
const THEMES = {
  coral: {
    name: 'Coral Dusk',
    bg1: '#2D1B14',
    bg2: '#4A2518',
    accent: '#F4845F',
    accentSoft: 'rgba(244,132,95,0.22)',
    accentBorder: 'rgba(244,132,95,0.25)',
    bubble1: 'radial-gradient(circle at 35% 35%, rgba(244,132,95,0.35), rgba(244,132,95,0.04))',
    bubble2: 'radial-gradient(circle at 60% 40%, rgba(240,100,70,0.25), rgba(240,100,70,0.03))',

    cardBg: 'rgba(255,255,255,0.07)',
    cardBorder: 'rgba(255,255,255,0.12)',
    tabBg: 'rgba(45,27,20,0.92)',
    headerBg: 'rgba(45,27,20,0.7)',
  },
  midnight: {
    name: 'Midnight Indigo',
    bg1: '#0D0E1F',
    bg2: '#151628',
    accent: '#7C6FF7',
    accentSoft: 'rgba(124,111,247,0.22)',
    accentBorder: 'rgba(124,111,247,0.28)',
    bubble1: 'radial-gradient(circle at 35% 35%, rgba(124,111,247,0.35), rgba(124,111,247,0.03))',
    bubble2: 'radial-gradient(circle at 60% 40%, rgba(90,80,220,0.25), rgba(90,80,220,0.03))',
    bubble3: 'radial-gradient(circle at 50% 50%, rgba(160,150,255,0.18), rgba(160,150,255,0.02))',
    text: '#fff',
    textSub: 'rgba(255,255,255,0.55)',
    textMuted: 'rgba(255,255,255,0.3)',
    cardBg: 'rgba(255,255,255,0.07)',
    cardBorder: 'rgba(255,255,255,0.1)',
    tabBg: 'rgba(13,14,31,0.92)',
    headerBg: 'rgba(13,14,31,0.7)',
  },
  forest: {
    name: 'Forest Sage',
    bg1: '#0D1F16',
    bg2: '#142B1E',
    accent: '#3DD68C',
    accentSoft: 'rgba(61,214,140,0.2)',
    accentBorder: 'rgba(61,214,140,0.25)',
    bubble1: 'radial-gradient(circle at 35% 35%, rgba(61,214,140,0.3), rgba(61,214,140,0.03))',
    bubble2: 'radial-gradient(circle at 60% 40%, rgba(45,168,126,0.25), rgba(45,168,126,0.03))',
    bubble3: 'radial-gradient(circle at 50% 50%, rgba(100,220,160,0.18), rgba(100,220,160,0.02))',
    text: '#fff',
    textSub: 'rgba(255,255,255,0.55)',
    textMuted: 'rgba(255,255,255,0.3)',
    cardBg: 'rgba(255,255,255,0.07)',
    cardBorder: 'rgba(255,255,255,0.1)',
    tabBg: 'rgba(13,31,22,0.92)',
    headerBg: 'rgba(13,31,22,0.7)',
  },
  rose: {
    name: 'Rose Quartz',
    bg1: '#1F0D18',
    bg2: '#2B1422',
    accent: '#E879A8',
    accentSoft: 'rgba(232,121,168,0.22)',
    accentBorder: 'rgba(232,121,168,0.28)',
    bubble1: 'radial-gradient(circle at 35% 35%, rgba(232,121,168,0.35), rgba(232,121,168,0.04))',
    bubble2: 'radial-gradient(circle at 60% 40%, rgba(200,80,140,0.25), rgba(200,80,140,0.03))',
    bubble3: 'radial-gradient(circle at 50% 50%, rgba(255,160,200,0.2), rgba(255,160,200,0.02))',
    text: '#fff',
    textSub: 'rgba(255,255,255,0.55)',
    textMuted: 'rgba(255,255,255,0.3)',
    cardBg: 'rgba(255,255,255,0.07)',
    cardBorder: 'rgba(255,255,255,0.1)',
    tabBg: 'rgba(31,13,24,0.92)',
    headerBg: 'rgba(31,13,24,0.7)',
  },
};

// ─── DATA ────────────────────────────────────────────────────────────────────
const CATS = [
  { id:'work',     label:'Work',     color:'#7C6FF7' },
  { id:'personal', label:'Personal', color:'#F4845F' },
  { id:'health',   label:'Health',   color:'#3DD68C' },
  { id:'social',   label:'Social',   color:'#E879A8' },
];
const getCat = id => CATS.find(c=>c.id===id)||CATS[0];

const TODAY = (() => { const d=new Date(); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; })();
function p2(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function parseDate(s){ const[y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const EVENTS_INIT = [
  {id:1, title:'Morning standup',  date:'2026-05-01',time:'09:00',end:'09:30',cat:'work',   recur:'Daily'},
  {id:2, title:'Design critique',  date:'2026-05-01',time:'14:00',end:'15:30',cat:'work',   recur:''},
  {id:3, title:'Gym',              date:'2026-05-01',time:'06:30',end:'07:30',cat:'health', recur:'Daily'},
  {id:4, title:'Lunch with Jamie', date:'2026-05-02',time:'12:30',end:'13:30',cat:'social', recur:''},
  {id:5, title:'Sprint planning',  date:'2026-05-04',time:'10:00',end:'11:30',cat:'work',   recur:''},
  {id:6, title:'Doctor checkup',   date:'2026-05-05',time:'15:00',end:'15:30',cat:'health', recur:''},
  {id:7, title:'Movie night',      date:'2026-05-03',time:'19:00',end:'22:00',cat:'social', recur:''},
  {id:8, title:'Weekly review',    date:'2026-05-08',time:'17:00',end:'18:00',cat:'work',   recur:'Weekly'},
  {id:9, title:'Morning run',      date:'2026-05-06',time:'06:30',end:'07:15',cat:'health', recur:'Daily'},
  {id:10,title:'1:1 with manager', date:'2026-05-07',time:'11:00',end:'11:30',cat:'work',   recur:'Weekly'},
  {id:11,title:'Book club',        date:'2026-05-08',time:'18:30',end:'20:00',cat:'social', recur:''},
  {id:12,title:'Product demo',     date:'2026-05-12',time:'13:00',end:'14:00',cat:'work',   recur:''},
  {id:13,title:'Dentist',          date:'2026-05-14',time:'09:30',end:'10:00',cat:'health', recur:''},
  {id:14,title:'Birthday dinner',  date:'2026-05-16',time:'19:00',end:'22:00',cat:'social', recur:''},
  {id:15,title:'Yoga',             date:'2026-05-19',time:'08:00',end:'09:00',cat:'health', recur:'Weekly'},
  {id:16,title:'Client call',      date:'2026-05-21',time:'15:00',end:'16:00',cat:'work',   recur:''},
  {id:17,title:'Meditation',       date:'2026-05-26',time:'07:30',end:'08:00',cat:'personal',recur:'Daily'},
  {id:18,title:'Quarterly review', date:'2026-05-29',time:'10:00',end:'12:00',cat:'work',   recur:''},
  {id:19,title:'Submit expense ✓', date:'2026-05-06',time:'',end:'',cat:'work',   recur:'',isTask:true,priority:'high',   remind:'1-day'},
  {id:20,title:'Call dentist ✓',   date:'2026-05-09',time:'',end:'',cat:'health',recur:'',isTask:true,priority:'medium', remind:'30-min'},
  {id:21,title:'Renew license ✓',  date:'2026-05-14',time:'',end:'',cat:'personal',recur:'',isTask:true,priority:'high', remind:'1-week'},
];

function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function firstDow(y,m){ return new Date(y,m,1).getDay(); }
function fmtTime(t){ if(!t)return''; const[h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; return `${h%12||12}:${p2(m)} ${ap}`; }

// ─── BUBBLES BACKGROUND ───────────────────────────────────────────────────────
function BubbleBg({ theme }) {
  const T = THEMES[theme];
  return (
    <div style={{ position:'absolute', inset:0, overflow:'hidden', pointerEvents:'none', zIndex:0 }}>
      {/* Large background gradient */}
      <div style={{ position:'absolute', inset:0, background:`linear-gradient(160deg, ${T.bg1} 0%, ${T.bg2} 100%)` }}/>
      {/* Animated bubbles */}
      <div style={{ position:'absolute', width:340, height:340, borderRadius:'50%', top:-60, right:-80, background:T.bubble1, border:`1px solid ${T.accentBorder}`, animation:'float1 9s ease-in-out infinite' }}/>
      <div style={{ position:'absolute', width:220, height:220, borderRadius:'50%', top:220, left:-70, background:T.bubble2, border:`1px solid ${T.accentBorder}`, animation:'float2 11s ease-in-out infinite' }}/>
      <div style={{ position:'absolute', width:160, height:160, borderRadius:'50%', bottom:200, right:40, background:T.bubble3, border:`1px solid ${T.accentBorder}`, animation:'float3 8s ease-in-out infinite' }}/>
      <div style={{ position:'absolute', width:90,  height:90,  borderRadius:'50%', bottom:360, left:80, background:T.bubble1, border:`1px solid ${T.accentBorder}`, animation:'float4 10s ease-in-out infinite 2s' }}/>
      <div style={{ position:'absolute', width:60,  height:60,  borderRadius:'50%', top:160, right:60, background:T.bubble2, border:`1px solid ${T.accentBorder}`, animation:'float1 7s ease-in-out infinite 1s' }}/>
    </div>
  );
}

// ─── GLASS CARD ───────────────────────────────────────────────────────────────
function GlassCard({ theme, children, style={}, onClick }) {
  const T = THEMES[theme];
  return (
    <div onClick={onClick} style={{
      background: T.cardBg,
      border: `1px solid ${T.cardBorder}`,
      borderRadius: 16,
      backdropFilter: 'blur(16px)',
      WebkitBackdropFilter: 'blur(16px)',
      ...style,
    }}>{children}</div>
  );
}

// ─── iOS CALENDAR ─────────────────────────────────────────────────────────────
function IOSCalendar({ theme, events, setEvents }) {
  const T = THEMES[theme];
  const [tab,      setTab]     = React.useState('calendar');
  const [year,     setYear]    = React.useState(2026);
  const [month,    setMonth]   = React.useState(4);
  const [selDate,  setSelDate] = React.useState(TODAY);
  const [editorEv, setEditorEv]= React.useState(null);
  const [search,   setSearch]  = React.useState('');

  const navMonth = d => {
    let m=month+d, y=year;
    if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    setMonth(m); setYear(y);
  };

  const filtered = search ? events.filter(e=>e.title.toLowerCase().includes(search.toLowerCase())) : events;
  const dayEvs   = filtered.filter(e=>e.date===selDate);

  const saveEvent = ev => {
    if(ev.id) setEvents(evs=>evs.map(e=>e.id===ev.id?ev:e));
    else setEvents(evs=>[...evs,{...ev,id:Date.now()}]);
  };
  const deleteEvent = id => setEvents(evs=>evs.filter(e=>e.id!==id));

  return (
    <div style={{ position:'relative', display:'flex', flexDirection:'column', height:'100%', overflow:'hidden', color:T.text }}>
      <BubbleBg theme={theme}/>

      {/* Status bar area */}
      <div style={{ position:'relative', zIndex:2, flexShrink:0, paddingTop:14 }}>

        {/* Header */}
        <div style={{
          padding:'6px 20px 12px',
          backdropFilter:'blur(20px)',
          WebkitBackdropFilter:'blur(20px)',
        }}>
          {tab === 'calendar' && (
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
              <div>
                <div style={{ fontSize:22, fontWeight:700, color:T.text, letterSpacing:'-0.03em', lineHeight:1 }}>
                  {MONTHS[month]}
                </div>
                <div style={{ fontSize:13, color:T.textSub, fontWeight:500, marginTop:2 }}>{year}</div>
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                <button onClick={()=>navMonth(-1)} style={{ background:T.cardBg, border:`1px solid ${T.cardBorder}`, borderRadius:10, width:34, height:34, cursor:'pointer', color:T.accent, fontSize:16, display:'flex', alignItems:'center', justifyContent:'center', backdropFilter:'blur(8px)' }}>‹</button>
                <button onClick={()=>navMonth(1)}  style={{ background:T.cardBg, border:`1px solid ${T.cardBorder}`, borderRadius:10, width:34, height:34, cursor:'pointer', color:T.accent, fontSize:16, display:'flex', alignItems:'center', justifyContent:'center', backdropFilter:'blur(8px)' }}>›</button>
              </div>
            </div>
          )}
          {tab === 'agenda' && (
            <div style={{ fontSize:22, fontWeight:700, color:T.text, letterSpacing:'-0.03em' }}>Upcoming</div>
          )}
          {tab === 'search' && (
            <div style={{ position:'relative' }}>
              <svg style={{ position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', opacity:0.5 }} width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="white" strokeWidth="1.4"/><path d="M10 10l2.5 2.5" stroke="white" strokeWidth="1.4" strokeLinecap="round"/></svg>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search events…"
                style={{ width:'100%', padding:'11px 12px 11px 34px', borderRadius:12, border:`1px solid ${T.cardBorder}`, background:'rgba(255,255,255,0.1)', fontSize:14, color:T.text, outline:'none', backdropFilter:'blur(8px)' }}/>
            </div>
          )}
        </div>

        {/* Mini calendar strip */}
        {tab === 'calendar' && (
          <IOSMiniCal year={year} month={month} selDate={selDate}
            onSelect={d=>setSelDate(d)} events={filtered} theme={theme}/>
        )}
      </div>

      {/* Content area */}
      <div style={{ flex:1, overflowY:'auto', position:'relative', zIndex:2, minHeight:0 }}>
        {tab==='calendar' && (
          <div style={{ padding:'16px 16px 100px' }}>
            {/* Day label */}
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
              <div style={{ height:1, flex:1, background:`rgba(255,255,255,0.1)` }}/>
              <span style={{ fontSize:11, fontWeight:600, color:T.textSub, letterSpacing:'.06em', whiteSpace:'nowrap' }}>
                {selDate===TODAY?'TODAY — ':''}{parseDate(selDate).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase()}
              </span>
              <div style={{ height:1, flex:1, background:`rgba(255,255,255,0.1)` }}/>
            </div>
            {dayEvs.length===0 && (
              <GlassCard theme={theme} style={{ padding:'32px 20px', textAlign:'center' }}>
                <div style={{ fontSize:28, marginBottom:8, opacity:0.5 }}>📅</div>
                <div style={{ fontSize:13, color:T.textMuted }}>Nothing scheduled</div>
              </GlassCard>
            )}
            {dayEvs.sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(ev=>
              <IOSEventCard key={ev.id} ev={ev} onPress={()=>setEditorEv(ev)} theme={theme}/>
            )}
          </div>
        )}
        {tab==='agenda' && <IOSAgenda events={filtered} onPress={ev=>setEditorEv(ev)} theme={theme}/>}
        {tab==='search' && <IOSSearchResults events={filtered} search={search} onPress={ev=>setEditorEv(ev)} theme={theme}/>}
      </div>

      {/* FAB */}
      {tab !== 'search' && (
        <button onClick={()=>setEditorEv({date:selDate})} style={{
          position:'absolute', right:18, bottom:90, width:52, height:52,
          borderRadius:26, background:T.accent, border:'none', cursor:'pointer',
          display:'flex', alignItems:'center', justifyContent:'center',
          boxShadow:`0 4px 20px ${T.accent}55`, zIndex:10,
          transition:'transform 0.15s, box-shadow 0.15s',
        }}
        onMouseEnter={e=>{e.currentTarget.style.transform='scale(1.1)';e.currentTarget.style.boxShadow=`0 6px 28px ${T.accent}77`;}}
        onMouseLeave={e=>{e.currentTarget.style.transform='scale(1)';e.currentTarget.style.boxShadow=`0 4px 20px ${T.accent}55`;}}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2v14M2 9h14" stroke="white" strokeWidth="2.2" strokeLinecap="round"/></svg>
        </button>
      )}

      {/* Tab bar */}
      <div style={{
        position:'absolute', bottom:0, left:0, right:0, zIndex:10,
        display:'flex', background:T.tabBg,
        borderTop:`1px solid ${T.cardBorder}`,
        backdropFilter:'blur(24px)', WebkitBackdropFilter:'blur(24px)',
        paddingBottom:22, paddingTop:4,
      }}>
        {[
          { id:'calendar', label:'Calendar', icon: <CalIcon/> },
          { id:'agenda',   label:'Agenda',   icon: <ListIcon/> },
          { id:'search',   label:'Search',   icon: <SearchIcon/> },
        ].map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:4,
            padding:'8px 0 0', background:'none', border:'none', cursor:'pointer',
            transition:'opacity 0.15s',
          }}>
            <div style={{ color: tab===t.id ? T.accent : T.textMuted, transition:'color 0.2s' }}>{t.icon}</div>
            <span style={{ fontSize:10, fontWeight: tab===t.id ? 700 : 400, color: tab===t.id ? T.accent : T.textMuted, transition:'color 0.2s' }}>{t.label}</span>
          </button>
        ))}
      </div>

      {/* Editor sheet */}
      {editorEv !== null && (
        <IOSEditorPanel
          theme={theme}
          defaultDate={editorEv.date||selDate}
          editEv={editorEv.id?editorEv:null}
          onClose={()=>setEditorEv(null)}
          onSave={ev=>{saveEvent(ev);setEditorEv(null);}}
          onDelete={id=>{deleteEvent(id);setEditorEv(null);}}
        />
      )}
    </div>
  );
}

// ─── ICONS ───────────────────────────────────────────────────────────────────
function CalIcon(){return(<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="2" y="4" width="18" height="16" rx="3" stroke="currentColor" strokeWidth="1.6"/><path d="M2 9h18" stroke="currentColor" strokeWidth="1.6"/><path d="M7 2v3M15 2v3" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/><rect x="6" y="12" width="3" height="3" rx="0.5" fill="currentColor"/><rect x="10" y="12" width="3" height="3" rx="0.5" fill="currentColor"/></svg>);}
function ListIcon(){return(<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M8 6h10M8 11h10M8 16h10" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="11" r="1.2" fill="currentColor"/><circle cx="4.5" cy="16" r="1.2" fill="currentColor"/></svg>);}
function SearchIcon(){return(<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="10" cy="10" r="6.5" stroke="currentColor" strokeWidth="1.6"/><path d="M15 15l4 4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>);}

// ─── MINI CALENDAR ────────────────────────────────────────────────────────────
function IOSMiniCal({ year, month, selDate, onSelect, events, theme }) {
  const T = THEMES[theme];
  const first = firstDow(year, month);
  const days  = daysInMonth(year, month);
  const evDates = new Set(events.map(e=>e.date));
  const cells = [...Array(first).fill(null), ...Array.from({length:days},(_,i)=>i+1)];

  return (
    <div style={{ padding:'0 16px 10px' }}>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', textAlign:'center', marginBottom:4 }}>
        {DAYS3.map(d=><div key={d} style={{ fontSize:10, fontWeight:600, color:T.textMuted, padding:'2px 0' }}>{d[0]}</div>)}
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', textAlign:'center' }}>
        {cells.map((d,i) => {
          if(!d) return <div key={i}/>;
          const ds=`${year}-${p2(month+1)}-${p2(d)}`;
          const isSel=ds===selDate, isToday=ds===TODAY, hasEv=evDates.has(ds);
          return (
            <div key={i} onClick={()=>onSelect(ds)} style={{ padding:'3px 0', cursor:'pointer' }}>
              <div style={{
                width:32, height:32, lineHeight:'32px', borderRadius:'50%', margin:'0 auto',
                fontSize:13, fontWeight:isSel||isToday?700:400,
                background: isSel ? T.accent : isToday ? T.accentSoft : 'transparent',
                color: isSel ? '#fff' : isToday ? T.accent : T.text,
                border: isToday && !isSel ? `1.5px solid ${T.accent}` : 'none',
                position:'relative', transition:'background 0.15s',
              }}>
                {d}
                {hasEv && !isSel && <div style={{ position:'absolute', bottom:3, left:'50%', transform:'translateX(-50%)', width:4, height:4, borderRadius:'50%', background:T.accent }}/>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── EVENT CARD ───────────────────────────────────────────────────────────────
const PRI_COLOR = { low:'#3DD68C', medium:'#F4845F', high:'#E879A8' };
function IOSEventCard({ ev, onPress, theme }) {
  const T = THEMES[theme];
  const c = getCat(ev.cat);
  const [hov, setHov] = React.useState(false);
  return (
    <div onClick={onPress}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{
        display:'flex', gap:12, alignItems:'flex-start',
        background: hov ? 'rgba(255,255,255,0.12)' : T.cardBg,
        border:`1px solid ${T.cardBorder}`,
        borderRadius:16, padding:'14px 16px', marginBottom:10,
        backdropFilter:'blur(16px)', WebkitBackdropFilter:'blur(16px)',
        cursor:'pointer', transition:'background 0.15s, transform 0.1s',
        transform: hov ? 'scale(1.01)' : 'scale(1)',
      }}>
      {/* Color bar */}
      <div style={{ width:3, borderRadius:3, alignSelf:'stretch', background:c.color, minHeight:36, flexShrink:0 }}/>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ fontWeight:600, fontSize:14, color:T.text, marginBottom:3, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{ev.title}</div>
        <div style={{ fontSize:12, color:T.textSub }}>
          {ev.isTask ? (
            ev.priority && <span style={{ color:PRI_COLOR[ev.priority]||T.textSub, fontWeight:600 }}>
              {ev.priority.charAt(0).toUpperCase()+ev.priority.slice(1)} priority
            </span>
          ) : (
            <>
              {ev.time && `${fmtTime(ev.time)}${ev.end?` – ${fmtTime(ev.end)}`:''}`}
              {ev.recur && <span style={{ marginLeft:6, color:c.color }}>↻ {ev.recur}</span>}
            </>
          )}
        </div>
      </div>
      {ev.isTask ? (
        <div style={{ width:22, height:22, borderRadius:'50%', border:`2px solid ${c.color}`, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
          <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke={c.color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </div>
      ) : (
        <span style={{ fontSize:10, background:c.color+'28', color:c.color, borderRadius:7, padding:'3px 8px', fontWeight:700, flexShrink:0 }}>{c.label}</span>
      )}
    </div>
  );
}

// ─── AGENDA VIEW ──────────────────────────────────────────────────────────────
function IOSAgenda({ events, onPress, theme }) {
  const T = THEMES[theme];
  const upcoming=[...events].filter(e=>e.date>=TODAY).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const grouped={};
  upcoming.forEach(e=>{ if(!grouped[e.date]) grouped[e.date]=[]; grouped[e.date].push(e); });

  return (
    <div style={{ padding:'12px 16px 100px' }}>
      {upcoming.length===0 && (
        <GlassCard theme={theme} style={{ padding:'40px 20px', textAlign:'center' }}>
          <div style={{ fontSize:13, color:T.textMuted }}>No upcoming events</div>
        </GlassCard>
      )}
      {Object.entries(grouped).map(([date,evs]) => {
        const isToday=date===TODAY;
        const d=parseDate(date);
        return (
          <div key={date} style={{ marginBottom:22 }}>
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:10 }}>
              <div style={{ textAlign:'center', width:44, flexShrink:0 }}>
                <div style={{ fontSize:9, fontWeight:700, color:isToday?T.accent:T.textMuted, letterSpacing:'.07em' }}>{DAYS3[d.getDay()].toUpperCase()}</div>
                <div style={{
                  fontSize:20, fontWeight:700, lineHeight:'36px',
                  width:36, height:36, borderRadius:'50%', margin:'2px auto 0', textAlign:'center',
                  background: isToday ? T.accent : 'transparent',
                  color: isToday ? '#fff' : T.text,
                  border: !isToday ? `1.5px solid rgba(255,255,255,0.15)` : 'none',
                }}>{d.getDate()}</div>
              </div>
              <div style={{ flex:1, height:1, background:'rgba(255,255,255,0.1)' }}/>
              {isToday && <span style={{ fontSize:9, fontWeight:700, color:T.accent, background:T.accentSoft, borderRadius:99, padding:'2px 8px', letterSpacing:'.06em' }}>TODAY</span>}
            </div>
            {evs.map(ev=><IOSEventCard key={ev.id} ev={ev} onPress={()=>onPress(ev)} theme={theme}/>)}
          </div>
        );
      })}
    </div>
  );
}

// ─── SEARCH VIEW ─────────────────────────────────────────────────────────────
function IOSSearchResults({ events, search, onPress, theme }) {
  const T = THEMES[theme];
  if(!search) return (
    <div style={{ padding:'60px 20px', textAlign:'center', color:T.textMuted }}>
      <div style={{ fontSize:32, marginBottom:12, opacity:0.4 }}>🔍</div>
      <div style={{ fontSize:13 }}>Search for events and tasks</div>
    </div>
  );
  const results=events.filter(e=>e.title.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.date.localeCompare(b.date));
  return (
    <div style={{ padding:'12px 16px 100px' }}>
      <div style={{ fontSize:11, color:T.textMuted, marginBottom:10, letterSpacing:'.04em' }}>{results.length} RESULT{results.length!==1?'S':''}</div>
      {results.map(ev=><IOSEventCard key={ev.id} ev={ev} onPress={()=>onPress(ev)} theme={theme}/>)}
      {results.length===0 && (
        <GlassCard theme={theme} style={{ padding:'32px 20px', textAlign:'center' }}>
          <div style={{ fontSize:13, color:T.textMuted }}>No events found</div>
        </GlassCard>
      )}
    </div>
  );
}

// ─── EDITOR PANEL ─────────────────────────────────────────────────────────────
function IOSEditorPanel({ theme, defaultDate, editEv, onClose, onSave, onDelete }) {
  const T = THEMES[theme];
  const isEdit = !!(editEv?.id);
  const [tab,       setTab]      = React.useState(editEv?.isTask?'task':'event');
  const [title,     setTitle]    = React.useState(!editEv?.isTask?(editEv?.title||''):'');
  const [date,      setDate]     = React.useState(editEv?.date||defaultDate||TODAY);
  const [time,      setTime]     = React.useState(editEv?.time||'09:00');
  const [end,       setEnd]      = React.useState(editEv?.end||'10:00');
  const [cat,       setCat]      = React.useState(editEv?.cat||'work');
  const [recur,     setRecur]    = React.useState(editEv?.recur||'');
  const [taskTitle, setTaskTitle]= React.useState(editEv?.isTask?(editEv?.title?.replace(' ✓','')||''):'');
  const [dueDate,   setDueDate]  = React.useState(editEv?.date||defaultDate||TODAY);
  const [remind,    setRemind]   = React.useState(editEv?.remind||'1-day');
  const [priority,  setPriority] = React.useState(editEv?.priority||'medium');

  const handleSave = () => {
    if(tab==='event') { if(!title.trim()) return; onSave({...(editEv||{}),title,date,time,end,cat,recur,isTask:false}); }
    else { if(!taskTitle.trim()) return; onSave({...(editEv||{}),title:taskTitle.replace(' ✓','')+' ✓',date:dueDate,time:'',end:'',cat:'personal',recur:'',isTask:true,remind,priority}); }
  };

  const rowSt = {
    padding:'13px 16px', display:'flex', alignItems:'center', justifyContent:'space-between',
    borderBottom:`1px solid rgba(255,255,255,0.06)`,
  };
  const inputColSt = { fontSize:14, color:T.text, background:'transparent', border:'none', outline:'none', textAlign:'right', width:'60%' };

  return (
    <div style={{ position:'absolute', inset:0, zIndex:200, display:'flex', flexDirection:'column', justifyContent:'flex-end' }}
      onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      {/* Scrim */}
      <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.6)', backdropFilter:'blur(6px)', animation:'fadeIn 0.2s ease' }}/>
      {/* Sheet */}
      <div style={{
        position:'relative', zIndex:1,
        background: `${T.bg1}EE`,
        borderRadius:'24px 24px 0 0',
        maxHeight:'88%', overflowY:'auto',
        borderTop:`1px solid ${T.cardBorder}`,
        backdropFilter:'blur(32px)', WebkitBackdropFilter:'blur(32px)',
        animation:'slideUp 0.3s cubic-bezier(0.32,0.72,0,1)',
      }}>
        {/* Handle */}
        <div style={{ display:'flex', justifyContent:'center', padding:'12px 0 4px' }}>
          <div style={{ width:40, height:4, borderRadius:2, background:'rgba(255,255,255,0.2)' }}/>
        </div>

        {/* Tab switcher */}
        <div style={{ display:'flex', padding:'0 16px 12px', gap:8 }}>
          {['event','task'].map(t=>(
            <button key={t} onClick={()=>setTab(t)} style={{
              flex:1, padding:'10px 0', borderRadius:12, border:'none', cursor:'pointer', fontSize:13, fontWeight:600,
              background: tab===t ? T.accent : T.cardBg,
              color: tab===t ? '#fff' : T.textSub,
              backdropFilter:'blur(8px)',
              transition:'all 0.15s',
            }}>{t==='event'?'Event':'Task'}</button>
          ))}
        </div>

        {/* Nav row */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 16px 14px' }}>
          <button onClick={onClose} style={{ background:'none', border:'none', cursor:'pointer', fontSize:14, color:T.accent, fontWeight:500 }}>Cancel</button>
          <span style={{ fontWeight:700, fontSize:15, color:T.text }}>
            {isEdit?(tab==='event'?'Edit Event':'Edit Task'):(tab==='event'?'New Event':'New Task')}
          </span>
          <button onClick={handleSave} style={{ background:'none', border:'none', cursor:'pointer', fontSize:14, color:T.accent, fontWeight:700 }}>{isEdit?'Save':'Add'}</button>
        </div>

        {tab==='event' && (
          <>
            <div style={{ margin:'0 16px 10px', borderRadius:14, overflow:'hidden', background:T.cardBg, border:`1px solid ${T.cardBorder}` }}>
              <div style={rowSt}>
                <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Event title"
                  style={{ fontSize:15, fontWeight:500, border:'none', outline:'none', background:'transparent', width:'100%', color:T.text, '::placeholder':{ color:T.textMuted } }} autoFocus/>
              </div>
            </div>
            <div style={{ margin:'0 16px 10px', borderRadius:14, overflow:'hidden', background:T.cardBg, border:`1px solid ${T.cardBorder}` }}>
              <div style={rowSt}><span style={{ fontSize:14, color:T.text, fontWeight:500 }}>Date</span><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{ ...inputColSt, colorScheme:'dark' }}/></div>
              <div style={rowSt}><span style={{ fontSize:14, color:T.text, fontWeight:500 }}>Start</span><input type="time" value={time} onChange={e=>setTime(e.target.value)} style={{ ...inputColSt, colorScheme:'dark' }}/></div>
              <div style={{ ...rowSt, borderBottom:'none' }}><span style={{ fontSize:14, color:T.text, fontWeight:500 }}>End</span><input type="time" value={end} onChange={e=>setEnd(e.target.value)} style={{ ...inputColSt, colorScheme:'dark' }}/></div>
            </div>
            <div style={{ margin:'0 16px 10px', borderRadius:14, overflow:'hidden', background:T.cardBg, border:`1px solid ${T.cardBorder}` }}>
              <div style={rowSt}>
                <span style={{ fontSize:14, color:T.text, fontWeight:500 }}>Category</span>
                <div style={{ display:'flex', gap:8 }}>
                  {CATS.map(c=><div key={c.id} onClick={()=>setCat(c.id)} style={{ width:22, height:22, borderRadius:'50%', background:c.color, cursor:'pointer', boxShadow:cat===c.id?`0 0 0 2px ${T.bg1}, 0 0 0 4px ${c.color}`:'none', transition:'box-shadow 0.15s' }}/>)}
                </div>
              </div>
              <div style={{ ...rowSt, borderBottom:'none' }}>
                <span style={{ fontSize:14, color:T.text, fontWeight:500 }}>Repeat</span>
                <select value={recur} onChange={e=>setRecur(e.target.value)} style={{ ...inputColSt, cursor:'pointer', colorScheme:'dark' }}>
                  {['','Daily','Weekly','Monthly','Yearly'].map(r=><option key={r} value={r}>{r||'Never'}</option>)}
                </select>
              </div>
            </div>
          </>
        )}

        {tab==='task' && (
          <>
            <div style={{ margin:'0 16px 10px', borderRadius:14, overflow:'hidden', background:T.cardBg, border:`1px solid ${T.cardBorder}` }}>
              <div style={{ ...rowSt, borderBottom:'none' }}>
                <input value={taskTitle} onChange={e=>setTaskTitle(e.target.value)} placeholder="Task name"
                  style={{ fontSize:15, fontWeight:500, border:'none', outline:'none', background:'transparent', width:'100%', color:T.text }} autoFocus/>
              </div>
            </div>
            <div style={{ margin:'0 16px 10px', borderRadius:14, overflow:'hidden', background:T.cardBg, border:`1px solid ${T.cardBorder}` }}>
              <div style={{ ...rowSt, borderBottom:'none' }}>
                <span style={{ fontSize:14, color:T.text, fontWeight:500 }}>Due date</span>
                <input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} style={{ ...inputColSt, colorScheme:'dark' }}/>
              </div>
            </div>
            <div style={{ margin:'0 16px 10px', borderRadius:14, overflow:'hidden', background:T.cardBg, border:`1px solid ${T.cardBorder}`, padding:'12px 16px' }}>
              <div style={{ fontSize:11, fontWeight:700, color:T.textMuted, marginBottom:10, letterSpacing:'.06em' }}>REMIND ME</div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:7 }}>
                {[{v:'at-time',l:'At due time'},{v:'30-min',l:'30 min before'},{v:'1-day',l:'1 day before'},{v:'1-week',l:'1 week before'},{v:'2-weeks',l:'2 weeks before'},{v:'custom',l:'Custom…'}].map(r=>(
                  <div key={r.v} onClick={()=>setRemind(r.v)} style={{
                    padding:'9px 6px', borderRadius:10, cursor:'pointer', fontSize:11, fontWeight:600, textAlign:'center',
                    background: remind===r.v ? T.accent : 'rgba(255,255,255,0.06)',
                    color: remind===r.v ? '#fff' : T.textSub,
                    border:`1px solid ${remind===r.v ? T.accent : 'rgba(255,255,255,0.08)'}`,
                    transition:'all 0.15s',
                  }}>{r.l}</div>
                ))}
              </div>
            </div>
            <div style={{ margin:'0 16px 10px', borderRadius:14, overflow:'hidden', background:T.cardBg, border:`1px solid ${T.cardBorder}`, padding:'12px 16px' }}>
              <div style={{ fontSize:11, fontWeight:700, color:T.textMuted, marginBottom:10, letterSpacing:'.06em' }}>PRIORITY</div>
              <div style={{ display:'flex', gap:8 }}>
                {[{v:'low',l:'Low',c:'#3DD68C'},{v:'medium',l:'Medium',c:'#F4845F'},{v:'high',l:'High',c:'#E879A8'}].map(p=>(
                  <div key={p.v} onClick={()=>setPriority(p.v)} style={{
                    flex:1, padding:'10px 0', textAlign:'center', borderRadius:10, cursor:'pointer',
                    fontSize:12, fontWeight:700,
                    background: priority===p.v ? p.c : 'rgba(255,255,255,0.06)',
                    color: priority===p.v ? '#fff' : p.c,
                    border:`1px solid ${priority===p.v ? p.c : 'rgba(255,255,255,0.08)'}`,
                    transition:'all 0.15s',
                  }}>{p.l}</div>
                ))}
              </div>
            </div>
          </>
        )}

        {isEdit && onDelete && (
          <div style={{ margin:'0 16px 10px', borderRadius:14, overflow:'hidden', background:T.cardBg, border:`1px solid ${T.cardBorder}` }}>
            <button onClick={()=>onDelete(editEv.id)} style={{
              width:'100%', padding:'15px', background:'transparent', border:'none', cursor:'pointer',
              fontSize:15, color:'#FF6B6B', fontWeight:500,
            }}>Delete {tab==='event'?'Event':'Task'}</button>
          </div>
        )}
        <div style={{ height:32 }}/>
      </div>
    </div>
  );
}

// ─── THEME PICKER ─────────────────────────────────────────────────────────────
function ThemePicker({ current, onChange }) {
  return (
    <div style={{ position:'fixed', bottom:100, right:14, zIndex:300, display:'flex', flexDirection:'column', gap:8 }}>
      {Object.entries(THEMES).map(([key, T]) => (
        <button key={key} onClick={()=>onChange(key)} title={T.name} style={{
          width:32, height:32, borderRadius:'50%',
          background:`linear-gradient(135deg, ${T.accent}, ${T.bg2})`,
          border: current===key ? `2.5px solid white` : `2px solid rgba(255,255,255,0.2)`,
          cursor:'pointer', transition:'transform 0.15s, border 0.15s',
          boxShadow: current===key ? `0 0 12px ${T.accent}88` : 'none',
          transform: current===key ? 'scale(1.15)' : 'scale(1)',
        }}/>
      ))}
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [events,   setEvents]  = React.useState(EVENTS_INIT);
  const [theme,    setTheme]   = React.useState('coral');
  const T = THEMES[theme];

  return (
    <div style={{ width:'100%', height:'100%', background:T.bg1 }}>
      <IOSCalendar theme={theme} events={events} setEvents={setEvents}/>
      <ThemePicker current={theme} onChange={setTheme}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
